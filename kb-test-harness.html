<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KB UI Test Harness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <!-- Minimal standalone mount for the Knowledge Base feature so the local
         Playwright UI test can drive the REAL kb.js + REAL api routes without
         booting the full app.js (which statically imports archive.js and fails
         to initialize in the local dev harness). The live Vercel test covers
         the full integrated app. -->
    <section id="kbView">
      <div id="kbOnboarding" class="welcome-card">
        <h2 class="welcome-title">Your Classroom Knowledge Base 📚</h2>
      </div>
      <div id="kbBuildPanel" class="archive-build-panel" hidden>
        <div id="kbBuildStatus" role="status" aria-live="polite" aria-atomic="true">Starting…</div>
        <div class="archive-build-progress"><div id="kbBuildProgressBar"></div></div>
        <div id="kbBuildLog"></div>
      </div>
      <div id="kbMain" hidden>
        <div id="kbMetaBar" class="stat-bar"></div>
        <div class="kb-dev-tools" data-dev-only>
          <button id="kbRelatedCacheReset" class="ghost-btn" type="button">Reset related-preview cache</button>
          <span id="kbRelatedCacheStats" aria-live="polite">Related-preview cache: 0 hits · 0 misses</span>
          <span id="kbRelatedTimingStats" aria-live="polite">Related-preview timing: no samples</span>
          <span id="kbRelatedTimingPercentiles" aria-live="polite">Warm percentiles: no samples</span>
          <span id="kbRelatedCacheResetStatus" class="sr-only" role="status" aria-live="polite"></span>
        </div>
        <div id="kbStudyProgress" class="kb-study-progress" role="status" aria-live="polite"></div>
        <section id="kbReviewDigest" class="kb-review-digest" aria-labelledby="kbReviewDigestTitle" hidden></section>
        <!-- Mirrors index.html's Study tabs. This harness is a hand-kept copy of
             the KB markup; without the tab strip the panels never switch and
             Browse is unreachable, so the tests here stop matching the app. -->
        <div id="studyTabs" class="study-tabs" role="tablist" aria-label="Study views">
          <button class="study-tab-btn active" data-tab="search" type="button" role="tab" aria-selected="true" aria-controls="studyPanel-search">Search</button>
          <button class="study-tab-btn" data-tab="browse" type="button" role="tab" aria-selected="false" aria-controls="studyPanel-browse">Browse</button>
          <button class="study-tab-btn" data-tab="curriculum" type="button" role="tab" aria-selected="false" aria-controls="studyPanel-curriculum">Curriculum</button>
          <button class="study-tab-btn" data-tab="manage" type="button" role="tab" aria-selected="false" aria-controls="studyPanel-manage">Manage</button>
        </div>

        <div id="studyPanel-search" class="study-panel" role="tabpanel" tabindex="-1">
          <div class="kb-search-bar">
            <input id="kbSearchInput" type="text" placeholder="Search everything you've studied…" autocomplete="off" />
          </div>
          <div id="kbExamples" class="kb-examples" hidden>
            <span class="kb-examples-label">Try:</span>
          </div>
          <div id="kbFilterChips" class="kb-filter-chips" hidden></div>
          <div class="kb-sort-row">
            <label class="kb-sort-label" for="kbSort">Sort:</label>
            <select id="kbSort" class="kb-sort-select">
              <option value="relevance">Relevance</option>
              <option value="recency">Newest first</option>
              <option value="course">By course</option>
              <option value="title">By title</option>
            </select>
          </div>
          <div id="kbResultCount" class="kb-result-count" hidden></div>
          <div id="kbFilterStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
          <div id="kbResults" class="list compact" hidden></div>
        </div>

        <div id="studyPanel-browse" class="study-panel" role="tabpanel" tabindex="-1" hidden>
          <div id="kbBrowse" class="kb-browse" hidden>
            <div class="kb-browse-head">
              <h3>Browse by course</h3>
              <button id="kbBrowseBack" class="link-btn" type="button" hidden>← All courses</button>
            </div>
            <div id="kbBrowseCourses" class="kb-browse-courses"></div>
            <div id="kbBrowseNotes" class="list compact" hidden></div>
          </div>
        </div>

        <div id="studyPanel-curriculum" class="study-panel" role="tabpanel" tabindex="-1" hidden>
          <div id="kbCurriculumGrid" class="curriculum-grid"></div>
        </div>

        <div id="studyPanel-manage" class="study-panel" role="tabpanel" tabindex="-1" hidden>
          <div class="study-manage-actions">
            <button id="kbRebuildBtn" class="primary" type="button">⚡ Generate / update database</button>
            <button id="kbManageLoadFileLink" class="ghost-btn" type="button">Import archive.json</button>
            <button id="kbExportJson" class="ghost-btn" type="button">JSON</button>
            <button id="kbExportMd" class="ghost-btn" type="button">Markdown</button>
            <button id="kbExportCsv" class="ghost-btn" type="button">CSV</button>
            <span id="kbExportStatus" class="kb-export-status" hidden></span>
          </div>
        </div>
        <div class="kb-tutor-wrap">
          <button id="kbTutorOpen" class="primary" type="button">💬 Ask the AI tutor</button>
        </div>
      </div>
    </section>
  </main>

  <div id="kbTutorModal" class="modal" hidden>
    <div class="modal-card modal-card-tall">
      <header><h3>AI Tutor</h3><button id="kbTutorClose" aria-label="Close">×</button></header>
      <div id="kbTutorSources" class="ai-context"></div>
      <div id="kbTutorMessages" class="ai-messages"></div>
      <form id="kbTutorForm" class="ai-form">
        <input id="kbTutorInput" type="text" placeholder="Ask about the knowledge base…" autocomplete="off" />
        <button type="submit">Send</button>
        <button id="kbTutorClearChat" type="button" title="Clear the current chat">Clear chat</button>
        <button id="kbTutorNewTopic" type="button" title="Start a fresh tutor conversation">New topic</button>
      </form>
      <div class="ai-quick">
        <button data-prompt="Explain from scratch">Explain from scratch</button>
        <button data-prompt="Quiz me">Quiz me</button>
        <button data-prompt="Key points">Key points</button>
        <button data-prompt="Explain like I'm 12">Explain like I'm 12</button>
        <button data-prompt="Practice problem">Practice problem</button>
      </div>
    </div>
  </div>

  <div id="kbNoteModal" class="modal" hidden>
    <div class="modal-card modal-card-tall">
      <header><h3 id="kbNoteTitle">Note</h3><button id="kbNoteClose" aria-label="Close">×</button></header>
      <div id="kbNoteMeta" class="kb-note-meta"></div>
      <div id="kbNoteModalStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="kbNoteBody" class="archive-note-body"></div>
      <div id="kbNoteRelated" class="kb-related" hidden>
        <h4 class="kb-related-title">Related notes</h4>
        <div id="kbNoteRelatedList" class="kb-related-list"></div>
      </div>
      <footer>
        <a id="kbNoteObsidianLink" class="classroom-link" target="_blank" rel="noopener" hidden>Open in Obsidian</a>
        <button id="kbNoteCloseBtn" class="primary">Close</button>
      </footer>
    </div>
  </div>

  <script type="module">
    import { showKbView } from "/kb.js";
    import { saveKbBundle } from "/kb-local.js";
    import { idbGet } from "/archive.js";
    import { resetRelatedTokenCache, relatedTokenCacheStats, formatRelatedTokenCacheStats, relatedPreviewTimingStats, relatedPreviewTimingSamples, formatRelatedPreviewTimingStats, relatedPreviewTimingPercentiles } from "/kb-client-search.js";
    const resetButton = document.getElementById("kbRelatedCacheReset");
    const statsLabel = document.getElementById("kbRelatedCacheStats");
    const timingLabel = document.getElementById("kbRelatedTimingStats");
    const percentileLabel = document.getElementById("kbRelatedTimingPercentiles");
    const resetStatus = document.getElementById("kbRelatedCacheResetStatus");
    const localHarness = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const updateStats = () => {
      if (statsLabel) statsLabel.textContent = formatRelatedTokenCacheStats(relatedTokenCacheStats());
      if (timingLabel) timingLabel.textContent = formatRelatedPreviewTimingStats(relatedPreviewTimingStats());
      if (percentileLabel) {
        const stats = relatedPreviewTimingPercentiles(relatedPreviewTimingSamples());
        percentileLabel.textContent = stats.samples ? `Warm percentiles: p50 ${stats.p50Ms.toFixed(2)}ms · p95 ${stats.p95Ms.toFixed(2)}ms · ${stats.samples} sample` : "Warm percentiles: no samples";
      }
    };
    if (!localHarness) {
      resetButton?.remove();
      statsLabel?.remove();
    } else {
      resetButton?.addEventListener("click", () => {
        resetRelatedTokenCache();
        updateStats();
        if (resetStatus) resetStatus.textContent = "Related-preview cache reset.";
      });
      updateStats();
      setInterval(updateStats, 250);
    }
    // Hydrate the browser-local corpus from the dev server's seeded store.
    //
    // The harness used to reach the KB surface through /api/kb-search: the app
    // probed that route, found a populated store and revealed #kbMain. Those
    // routes are gone — the app searches its own IndexedDB bundle and never
    // asks a server — so the harness has to put the seed data where the app
    // actually looks. /api/kb-store?action=export is the dev server's copy of
    // whatever scripts/seed-dev.mjs loaded, so the fixtures stay unchanged.
    async function hydrateLocalCorpus() {
      try {
        // Read the record directly rather than through loadKbBundle(): that
        // path honours __cwaTestLoadDelayMs, the artificial delay the
        // loading-state test injects to inspect the discovery surface. Waiting
        // on it here would hold back showKbView() and make the surface appear
        // after the assertions rather than during them.
        const existing = await idbGet("kb-bundle");
        if (existing?.data?.notes?.length) return;
      } catch {}
      try {
        const r = await fetch("/api/kb-store?action=export");
        if (!r.ok) return;
        const { bundle } = await r.json();
        if (bundle?.notes?.length) await saveKbBundle(bundle);
      } catch {}
    }

    // Wire events + reveal the KB surface (equivalent to setView('kb') in app.js).
    await hydrateLocalCorpus();
    showKbView();
  </script>
</body>
</html>
